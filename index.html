<style>

:root {

    --green: #30451f;
    --green-dark: #263918;

    --black: #11110e;

    --paper: #ffffff;

    --circle-light: #e7e7dc;

    --leaf: #d9ddd5;

    --serif:
        "Cormorant Garamond",
        Georgia,
        "Times New Roman",
        serif;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {

    background: var(--paper);
    color: var(--green);
    font-family: var(--serif);
    overflow-x: hidden;
}

button,
a {
    font-family: inherit;
}

.page {

    position: relative;
    width: 100%;
    min-height: 100vh;
    background: white;
    overflow: hidden;
}

.page-right-line {

    position: absolute;
    top: 0;
    right: 18px;
    width: 1px;
    height: 100%;
    background: var(--black);
    z-index: 30;
    pointer-events: none;
}

.corner-square {

    position: absolute;
    right: 0;
    bottom: 0;
    width: 19px;
    height: 22px;
    background: var(--green);
    z-index: 40;
}

.green-strip {

    position: absolute;
    left: 0;
    top: 0;
    width: 130px;
    height: 467px;
    background-image: url("assets/wood.png");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 1;
    overflow: hidden;
}


.circle {

    position: absolute;
    width: 340px;
    height: 340px;
    left: 132px;
    top: 22px;
    border-radius: 50%;
    background:

        radial-gradient(
            circle at 38% 33%,
            #ffffff 0%,
            #f2f2ec 50%,
            #dfdfd4 100%
        );

    z-index: 2;
}

.botanical {

    position: absolute;
    pointer-events: none;
    z-index: 3;
    opacity: .55;
}

.botanical.top {

    width: 170px;
    right: -5px;
    top: -5px;
}

.botanical.middle {

    width: 220px;
    right: -20px;
    top: 390px;
    opacity: .38;
}

.botanical.bottom {

    width: 180px;
    left: -55px;
    bottom: -10px;
    opacity: .48;
}

.photo-frame {

    position: absolute;
    z-index: 8;
    left: 55px;
    top: 96px;
    width: 286px;
    height: 371px;
}

.photo-frame img {

    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: relative;
    z-index: 3;
}

.photo-frame::before {

    content: "";
    position: absolute;
    left: 35px;
    top: -27px;
    width: 285px;
    height: 368px;
    border: 1px solid var(--black);
    z-index: 1;
    pointer-events: none;
}

.photo-line {

    position: absolute;
    left: 348px;
    top: 245px;
    width: 1px;
    height: 361px;
    background: var(--black);
    z-index: 9;
}

.photo-bottom-line {

    position: absolute;
    left: 56px;
    top: 473px;
    width: 325px;
    height: 1px;
    background: var(--black);
    z-index: 9;
}

.name {

    position: absolute;
    z-index: 10;
    left: 54px;
    top: 482px;
    width: 310px;
    color: var(--green);
}

.name-last {

    display: block;
    font-size: 29px;
    line-height: .95;
    letter-spacing: -.01em;
}

.name-first


{

    display: block;
    font-size: 47px;
    line-height: .91;
    letter-spacing: -.035em;
    white-space: nowrap;
}

.name-middle {

    display: block;
    font-size: 29px;
    line-height: 1;
    white-space: nowrap;
}

.links {

    position: absolute;
    top: 27px;
    right: 54px;
    z-index: 50;
}

.links-button {

    border: 0;
    padding: 0;
    margin: 0;
    background: transparent;
    color: var(--green);
    cursor: pointer;
    font-size: 23px;
    line-height: 1;
}

.links-button:hover {

    text-decoration: underline;
}

.links-menu {

    position: absolute;
    right: 0;
    top: 31px;
    width: 205px;
    padding: 15px 18px;
    background: rgba(255,255,255,.98);
    border: 1px solid var(--black);
    display: none;
}

.links-menu.open {

    display: block;
}

.links-menu a {

    display: block;
    padding: 8px 0;
    border-bottom: 1px solid #d4d7cf;
    color: var(--green);
    font-size: 18px;
    text-decoration: none;
}

.links-menu a:last-child {

    border-bottom: 0;
}

.links-menu a:hover {

    text-decoration: underline;
}

.intro {

    position: absolute;

    left: 65px;
    top: 631px;
    width: 479px;
    height: 103px;
    border: 1px solid var(--black);
    z-index: 10;
    background: rgba(255,255,255,.55);
    padding: 15px 20px;
}

.intro h1 {

    margin: 0;
    font-size: 25px;
    line-height: 1;
    font-weight: 400;
}

.works {

    position: absolute;

    left: 65px;
    top: 766px;
    width: 479px;
    display: grid;
    grid-template-columns:
        repeat(3, 123px);
    justify-content: space-between;
    z-index: 10;
}

.work-card {

    width: 123px;
    height: 103px;
    padding: 4px;
    background: white;
    border: 1px solid var(--black);
    cursor: pointer;
    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.work-card:hover {

    transform: translateY(-3px);
    box-shadow:
        0 8px 18px
        rgba(0,0,0,.13);
}

.work-card img {

    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.more {

    position: absolute;
    right: 31px;
    top: 882px;
    color: var(--green);
    font-size: 21px;
    line-height: 1;
    white-space: nowrap;
    z-index: 10;
    text-decoration: none;
}

.more:hover {

    text-decoration: underline;
}

.lightbox {

    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;

    background:
        rgba(17,21,14,.94);

    padding: 30px;
}

.lightbox.open {

    display: flex;
}

.lightbox img {

    max-width: 92vw;
    max-height: 90vh;
    width: auto;
    height: auto;
    object-fit: contain;
}

.close {

    position: absolute;

    top: 15px;
    right: 22px;
    padding: 0;
    border: 0;
    background: transparent;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 42px;
    line-height: 1;
    cursor: pointer;
}

}

@media (min-width: 651px) {

        width: 607px;
        min-height: 908px;
        margin: 0 auto;
    }
}

</style>

<script>

const linksButton =
    document.getElementById("linksButton");

const linksMenu =
    document.getElementById("linksMenu");

linksButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        linksMenu.classList.toggle("open");

    }
);

document.addEventListener(
    "click",
    function(event) {

        if (
            !linksMenu.contains(event.target)
            &&
            event.target !== linksButton
        ) {

            linksMenu.classList.remove("open");

        }

    }
);

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const closeLightboxButton =
    document.getElementById("closeLightbox");

const workCards =
    document.querySelectorAll(".work-card");

workCards.forEach(
    function(card) {

        card.addEventListener(
            "click",
            function() {

                const image =
                    card.getAttribute("data-full");

                lightboxImage.src =
                    image;

                lightbox.classList.add("open");

                document.body.style.overflow =
                    "hidden";

            }
        );

    }
);

function closeLightbox() {

    lightbox.classList.remove("open");

    lightboxImage.src = "";

    document.body.style.overflow = "";

}

closeLightboxButton.addEventListener(
    "click",
    closeLightbox
);

lightbox.addEventListener(
    "click",
    function(event) {

        if (
            event.target === lightbox
        ) {

            closeLightbox();

        }

    }
);

document.addEventListener(
    "keydown",

ve("open");
